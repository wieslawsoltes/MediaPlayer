name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MediaPlayer.sln

      - name: Build
        run: dotnet build MediaPlayer.sln -c Release --no-restore -warnaserror

      - name: Test Controls
        run: dotnet test src/MediaPlayer.Controls.Tests/MediaPlayer.Controls.Tests.csproj -c Release --no-build --logger "trx;LogFileName=controls-tests.trx" --results-directory ./artifacts/test-results

      - name: Test Demo
        run: dotnet test src/MediaPlayer.Demo.Tests/MediaPlayer.Demo.Tests.csproj -c Release --no-build --logger "trx;LogFileName=demo-tests.trx" --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: test
    outputs:
      artifact: nuget-packages-${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$GITHUB_REF_NAME" =~ $release_tag ]]; then
              echo '::error::Use a release tag such as v12.2.0 or v12.2.0-rc.1.'
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-preview.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore MediaPlayer.sln

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build MediaPlayer.sln -c Release --no-restore -warnaserror "-p:Version=$RELEASE_VERSION"

      - name: Pack packages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet pack src/MediaPlayer.Controls/MediaPlayer.Controls.csproj -c Release --no-build -o ./artifacts/packages "-p:Version=$RELEASE_VERSION"
          dotnet pack src/MediaPlayer.Native.Abstractions/MediaPlayer.Native.Abstractions.csproj -c Release --no-build -o ./artifacts/packages "-p:Version=$RELEASE_VERSION"
          dotnet pack src/MediaPlayer.Native.Interop/MediaPlayer.Native.Interop.csproj -c Release --no-build -o ./artifacts/packages "-p:Version=$RELEASE_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

  publish-nuget:
    name: Publish to NuGet
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs: pack
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to NuGet with OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push "artifacts/packages/*.snupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: Create GitHub release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    needs: [pack, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: artifacts/packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          fail_on_unmatched_files: true
          generate_release_notes: true
